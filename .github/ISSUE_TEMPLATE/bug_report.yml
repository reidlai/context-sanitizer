name: 🐛 Bug Report
description: Create a report to help us fix a defect or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much context as possible.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Rust Core (context-sanitizer)
        - Python Bindings (PyO3)
        - System One Semantic Firewall
        - Secret Engine (Regex / PII)
        - Agent Integration (LangGraph / Rig)
        - CLI / Proxy Daemon
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps & Input Payload
      description: Please provide code or prompt payload that reproduces the issue (mask real secrets!).
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: OS, Rust version (`rustc --version`), Python version (`python --version`), context-sanitizer version.
    validations:
      required: true
