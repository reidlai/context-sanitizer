name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Stage 1: Formatting & Linting
  stage-1-fmt-and-lint:
    name: "Stage 1: Formatting & Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy AST & lint checks
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Clippy for Wasm targets
        run: |
          cargo clippy --target wasm32-unknown-unknown -p wasm -- -D warnings
          cargo clippy --target wasm32-wasip1 -p wasm -- -D warnings

  # Stage 2: Source Code SAST & Secret Scanning
  stage-2-sast-and-secrets:
    name: "Stage 2: SAST & Secret Scanning"
    runs-on: ubuntu-latest
    needs: [stage-1-fmt-and-lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify #![forbid(unsafe_code)] and panic-free library attributes
        run: |
          grep -q '#!\[forbid(unsafe_code)\]' crates/context-sanitizer/src/lib.rs
          grep -q '#!\[deny(clippy::unwrap_used, clippy::expect_used, clippy::panic)\]' crates/context-sanitizer/src/lib.rs
          grep -q '#!\[forbid(unsafe_code)\]' crates/context-sanitizer-py/src/lib.rs
          grep -q '#!\[deny(clippy::unwrap_used, clippy::expect_used, clippy::panic)\]' crates/context-sanitizer-py/src/lib.rs
          grep -q '#!\[forbid(unsafe_code)\]' wasm/src/lib.rs
          grep -q '#!\[deny(clippy::unwrap_used, clippy::expect_used, clippy::panic)\]' wasm/src/lib.rs
      - name: Run Semgrep SAST Scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/rust
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Stage 3: Software Composition Analysis (SCA) & License Auditing
  stage-3-sca-and-licenses:
    name: "Stage 3: SCA & License Compliance"
    runs-on: ubuntu-latest
    needs: [stage-1-fmt-and-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
      - name: Run cargo-audit (RustSec Advisory DB)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Stage 4: Pre-Build Unit Tests, Source Integration Tests & >= 85% Coverage Gate
  stage-4-pre-build-tests-and-coverage:
    name: "Stage 4: Unit + Integration Tests & Coverage (${{ matrix.os }})"
    needs: [stage-2-sast-and-secrets, stage-3-sca-and-licenses]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run Unit Tests
        run: cargo test --workspace --lib --bins
      - name: Run In-Process Source Integration Tests
        run: cargo test --workspace --test '*'
      - name: Run Tier 3 ML Unit & Integration Tests
        run: cargo test --workspace --all-targets --features ml
      - name: Check Wasm and WASI Compilation
        run: |
          cargo check --target wasm32-unknown-unknown -p wasm
          cargo check --target wasm32-wasip1 -p wasm
      - name: Enforce >= 85% Line Coverage Gate
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 85
      - name: Setup uv for Python Gates
        uses: astral-sh/setup-uv@v5
      - name: Run Ruff Lint and Format Checks
        run: |
          uv run --with ruff ruff check crates/context-sanitizer-py
          uv run --with ruff ruff format --check crates/context-sanitizer-py
      - name: Run Python Unit & Middleware Tests (>= 85% Line Coverage)
        shell: bash
        run: |
          uv venv test_env
          uv pip install --python test_env -e crates/context-sanitizer-py pytest pytest-cov
          if [ "${{ runner.os }}" = "Windows" ]; then
            test_env/Scripts/python -m pytest crates/context-sanitizer-py/tests --cov=context_sanitizer --cov-fail-under=85
          else
            test_env/bin/python -m pytest crates/context-sanitizer-py/tests --cov=context_sanitizer --cov-fail-under=85
          fi

  # Stage 5: Gated Release Artifact Build
  stage-5-gated-release-build:
    name: "Stage 5: Gated Release Build (${{ matrix.os }})"
    needs: [stage-4-pre-build-tests-and-coverage]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Build Release Workspace Artifacts
        run: cargo build --release --workspace --all-targets
      - name: Build Wasm Release Artifacts
        run: |
          cargo build --release --target wasm32-unknown-unknown -p wasm
          cargo build --release --target wasm32-wasip1 -p wasm
      - name: Setup uv for Python Wheel Build
        uses: astral-sh/setup-uv@v5
      - name: Build Python Release Wheel
        run: uv run --with maturin maturin build --release --manifest-path crates/context-sanitizer-py/Cargo.toml --out target/wheels

  # Stage 6: Post-Build Black-Box Artifact E2E Verification
  stage-6-post-build-e2e-verification:
    name: "Stage 6: Post-Build E2E & Benchmark Verification (${{ matrix.os }})"
    needs: [stage-5-gated-release-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Build Release Binaries
        run: cargo build --release --workspace --all-targets
      - name: Execute Release-Mode Tier 1 E2E Pipeline
        run: cargo test --release --workspace --test e2e_tier1_pipeline -- --nocapture
      - name: Execute Release-Mode Tier 2 Compression & SLA Verification
        run: cargo test --release --workspace --test e2e_tier2_compression -- --nocapture
      - name: Execute Release-Mode Tier 3 ML Gatekeeper & SLA Verification
        run: cargo test --release --workspace --test e2e_tier3_ml_gatekeeper --features ml -- --nocapture
      - name: Execute Black-Box CLI Diagnostics and Benchmarks
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/context-sanitizer.exe xray --bench
          else
            ./target/release/context-sanitizer xray --bench
          fi
      - name: Setup uv for Post-Build Python Wheel Verification
        uses: astral-sh/setup-uv@v5
      - name: Build and Verify Python Wheel in Clean Virtualenv
        shell: bash
        run: |
          uv run --with maturin maturin build --release --manifest-path crates/context-sanitizer-py/Cargo.toml --out target/wheels
          uv venv clean_env
          WHEEL=$(ls target/wheels/*.whl | head -n 1)
          uv pip install --python clean_env "$WHEEL" pytest
          if [ "${{ runner.os }}" = "Windows" ]; then
            clean_env/Scripts/python -m pytest crates/context-sanitizer-py/tests/e2e_python_wheel.py -v
          else
            clean_env/bin/python -m pytest crates/context-sanitizer-py/tests/e2e_python_wheel.py -v
          fi
      - name: Setup Node.js for Wasm Verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.95
      - name: Build and Verify WebAssembly Black-Box E2E Suite
        shell: bash
        run: |
          cargo build --release --target wasm32-unknown-unknown -p wasm
          wasm-bindgen target/wasm32-unknown-unknown/release/wasm.wasm --out-dir wasm/pkg --target nodejs
          echo '{"type": "commonjs"}' > wasm/pkg/package.json
          node wasm/tests/e2e_wasm_client.mjs
