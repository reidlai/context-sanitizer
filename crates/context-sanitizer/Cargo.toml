[package]
name = "context-sanitizer"
description = "Pure-Rust System One semantic firewall, split-secret shadow vault, and syntax-safe token compressor for LLM and Agentic AI contexts."
readme = "../../README.md"
categories = ["development-tools", "parsing", "web-programming"]
keywords = ["sanitizer", "llm", "pii", "token-compression", "prompt-security"]
documentation = "https://docs.rs/context-sanitizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
aho-corasick.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
logos.workspace = true
candle-core = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = []
ml = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]
