[workspace]
resolver = "2"
members = [
    "crates/context-sanitizer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/reidlai/context-sanitizer"
authors = ["Reid Lai"]

[workspace.dependencies]
aho-corasick = "1.1.5"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "1.0.64"
getrandom = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
